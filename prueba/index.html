<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>La app cambió de dirección</title><meta name="theme-color" content="#9a3412">
<meta http-equiv="refresh" content="4;url=https://kbustamante.github.io/group/lacteos-prueba/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f3ea;font:16px/1.5 system-ui,sans-serif;color:#1d2433}
.c{max-width:380px;width:calc(100% - 32px);text-align:center}a{display:block;background:#9a3412;color:#fff;text-decoration:none;border-radius:12px;padding:14px;font-weight:600;margin:18px 0}small{color:#6b7280}</style></head>
<body><div class="c"><h2>La app PRUEBA Lácteos cambió de dirección</h2>
<p>Te llevamos a la nueva en unos segundos.</p>
<a href="https://kbustamante.github.io/group/lacteos-prueba/">Abrir la nueva dirección</a>
<p><small>Si tenías la app instalada en el celular, bórrala e instálala otra vez desde la dirección nueva:<br><b>kbustamante.github.io/group/lacteos-prueba/</b></small></p></div>
<script>
// Apaga la app vieja instalada aquí para que no quede en blanco ni muestre una versión vieja
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
setTimeout(() => location.replace('https://kbustamante.github.io/group/lacteos-prueba/'), 4000);
</script></body></html>
